[build-system]
requires = ["setuptools", "Cython>=0.29.33", "setuptools_scm", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcloud"
authors = [{ name = "Andreas Mueller", email = "t3kcit+wordcloud@gmail.com" }]
description = "A little word cloud generator"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.19.3", "pillow", "matplotlib"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/amueller/word_cloud"

[project.scripts]
wordcloud_cli = "wordcloud.__main__:main"

[tool.setuptools]
packages = ["wordcloud"]

[tool.setuptools_scm]
write_to = "wordcloud/_version.py"

[tool.cibuildwheel]
# matplotlib ships no 32-bit wheels past 3.7.5, so win32/i686 wordcloud wheels cannot be installed
archs = ["auto64"]
# CPython has no official Windows ARM64 release before 3.11
skip = ["cp39-win_arm64", "cp310-win_arm64"]
test-requires = ["pytest"]
# -o addopts= drops the coverage flags from setup.cfg, which target the source tree rather than the installed wheel
test-command = "pytest -o addopts= {project}/test"
